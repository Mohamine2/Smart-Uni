services:
  # MYSQL DATABASE
  db:
    image: mysql:8.0
    container_name: smart_uni_db
    restart: always
    environment:
      MYSQL_DATABASE: residence_connectee_db
      MYSQL_USER: uni_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smart_network

  # DJANGO APP (GUNICORN)
  web:
    image: mohamine2/smart-uni:latest
    container_name: smart_uni_web
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python populate_students.py &&
             python populate_study_rooms.py &&
             python populate_news.py &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    environment:
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=*
      - DEBUG=False
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=residence_connectee_db
      - DB_USER=uni_user
      - DB_PASSWORD=${DB_PASSWORD}
    expose:
      - "8000" # Docker virtual network
    depends_on:
      - db
    networks:
      - smart_network

  # 3. NGINX SERVER
  nginx:
    image: nginx:latest
    container_name: smart_uni_nginx
    restart: always
    ports:
      - "80:80" # Retrieve the EC2's public port
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
    depends_on:
      - web
    networks:
      - smart_network

volumes:
  mysql_data:
  static_volume:
  media_volume:

networks:
  smart_network:
    driver: bridge