upstream django {
    # Defines the backend server (Django running on port 8000)
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    # 1. Static files management (CSS, JS, images)
    location /static/ {
        alias /app/staticfiles/;
    }

    # 2. Media files management (User uploads)
    location /media/ {
        alias /app/mediafiles/;
    }

    # 3. Reverse proxy: Routes all other requests to Django (via Gunicorn)
    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

        # Recommended additions for security and protocol tracking:
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}