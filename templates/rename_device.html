{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>Rename device - Smart-Uni</title>
</head>
<body>
<main>
    <h2>Rename: {{ device.name }}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <a href="{% url 'dashboard' %}">Cancel</a>
    </form>
</main>
</body>
</html>
