{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>Edit Profile - Smart-Uni</title>
</head>
<body>
<header>
    <h1>Edit my information</h1>
    <a href="{% url 'dashboard' %}">Back to dashboard</a>
</header>

<main>
    <section>
        <form method="POST">
            {% csrf_token %}
            <fieldset>
                <legend>Personal Information</legend>
                <label for="first_name">First Name:</label>
                <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}" required>

                <label for="last_name">Last Name:</label>
                <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="{{ user.email }}" required>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" value="{{ user.phone_number }}">

                <label for="age">Age:</label>
                <input type="number" id="age" name="age" value="{{ user.age }}">

                <label for="sex">Gender:</label>
                <select id="sex" name="sex">
                    <option value="M" {% if user.sex == 'M' %}selected{% endif %}>Male</option>
                    <option value="F" {% if user.sex == 'F' %}selected{% endif %}>Female</option>
                </select>
            </fieldset>

            <button type="submit">Save changes</button>
        </form>
    </section>
</main>
</body>
</html>
