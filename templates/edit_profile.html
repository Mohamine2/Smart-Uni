{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>Edit Profile - Smart-Uni</title>
</head>
<body>
<header>
    <h1>Edit my information</h1>
    <a href="{% url 'dashboard' %}">Back to dashboard</a>
</header>
<main>
    <section>
        <form method="POST">
            {% csrf_token %}
            <fieldset>
                <legend>Personal Information</legend>
                {{ form.as_p }}
            </fieldset>
            <button type="submit">Save changes</button>
        </form>
    </section>
</main>
</body>
</html>
