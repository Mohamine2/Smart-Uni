{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>Add a device - Smart-Uni</title>
</head>
<body>
<main>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}<li>{{ message }}</li>{% endfor %}
        </ul>
    {% endif %}
    <h2>Add a new device</h2>

    <form method="POST">
        {% csrf_token %}

        <label for="device_name">Name:</label>
        <input type="text" id="device_name" name="device_name" required>

        <label for="device_type">Type:</label>
        <select id="device_type" name="device_type" required>
            {% for value, label in type_choices %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>

        <label for="room">Room:</label>
        <select id="room" name="room" required>
            {% for r in rooms %}
                <option value="{{ r.id }}">{{ r.name }} - Apartment {{ r.apartment.apartment_number }}</option>
            {% endfor %}
        </select>

        <label for="brand">Brand:</label>
        <input type="text" id="brand" name="brand" required>

        <label for="connectivity">Connectivity:</label>
        <select id="connectivity" name="connectivity" required>
            <option value="">-- Choose --</option>
            <option value="Wi-Fi">Wi-Fi</option>
            <option value="Bluetooth">Bluetooth</option>
            <option value="Zigbee">Zigbee</option>
        </select>

        <label for="battery_level">Battery level (%):</label>
        <input type="number" id="battery_level" name="battery_level" min="0" max="100">

        <label for="last_interaction">Last interaction:</label>
        <input type="datetime-local" id="last_interaction" name="last_interaction">

        <label for="description">Description:</label>
        <textarea id="description" name="description" rows="4"></textarea>

        <button type="submit">Save</button>
        <a href="{% url 'dashboard' %}">Cancel</a>
    </form>
</main>
</body>
</html>
