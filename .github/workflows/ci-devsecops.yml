name: CI Pipeline- DevSecOps Smart-Uni

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-secure:
    name: Build & Security Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the repository on the VM
      - name: Code checkout
        uses: actions/checkout@v4

      # 2. Set up Docker build engine
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Image build
      - name: Build Docker Image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true # Keep the image locally (waiting for the scan)
          tags: smart-uni:latest

      # 4. Trivy Scan
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smart-uni:latest'
          format: 'table'
          exit-code: 1 # Fail fast if a vulnerability is found
          ignore-unfixed : true
          vuln-type: 'CRITICAL, HIGH'

      #  DockerHub Login
      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Final image push
      - name: Push Docker Image to Registry
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # ${{ github.sha }} tag link the image to the associated image
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smart-uni:${{ github.sha }}, ${{ secrets.DOCKERHUB_USERNAME }}/smart-uni:latest

