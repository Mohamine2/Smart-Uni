name: CI Pipeline - DevSecOps Smart-Uni

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # CI : BUILD, TEST & SECURE (TRIVY)
  # ==========================================
  build-and-secure:
    name: Build & Security Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the repository on the VM
      - name: Code checkout
        uses: actions/checkout@v4

      # 2. Set up Docker build engine
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Image build
      - name: Build Docker Image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: smart-uni:latest

      # 4. Run Tests & Coverage
      - name: Run Unit & Integration Tests
        run: |
          docker run --rm \
            -e SECRET_KEY="ci-test-key-safe-for-github-actions" \
            -e USE_SQLITE="True" \
            -e COVERAGE_FILE="/tmp/.coverage" \
            smart-uni:latest \
            coverage run manage.py test residence_connectee

      # 5. Trivy Scan
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smart-uni:latest'
          format: 'table'
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 6. DockerHub Login
      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Final image push
      - name: Push Docker Image to Registry
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-uni:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-uni:latest